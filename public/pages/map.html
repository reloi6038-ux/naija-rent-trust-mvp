<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map Search — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    #map { height: calc(100vh - 200px); min-height: 500px; border-radius: 14px; z-index: 1; }
    @media (max-width: 860px) { #map { height: calc(100vh - 260px); } }
    .leaflet-popup-content { font-family: var(--font); }
    .map-card { display: flex; gap: 10px; margin-bottom: 8px; }
    .map-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section-sm">
    <div class="flex-between mb-3" style="flex-wrap:wrap;gap:12px;">
      <div>
        <div class="eyebrow">Map</div>
        <h1 style="margin:0;font-size:1.5rem;">Browse on map</h1>
      </div>
      <a class="btn btn-ghost btn-sm" href="/pages/properties">← List view</a>
    </div>

    <div id="map"></div>
    <p class="helper mt-2">Zoom and pan the map. Listings outside the visible area are hidden. Tap a marker to see details.</p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/compare.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const map = L.map('map').setView([6.5244, 3.3792], 11); // Lagos center
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    const markers = L.markerClusterGroup();

    async function loadMarkers() {
      markers.clearLayers();
      const bounds = map.getBounds();
      const q = new URLSearchParams({
        neLat: bounds.getNorthEast().lat,
        neLng: bounds.getNorthEast().lng,
        swLat: bounds.getSouthWest().lat,
        swLng: bounds.getSouthWest().lng,
        limit: 200
      });
      try {
        const { data } = await API.get('/properties?' + q.toString());
        data.forEach(p => {
          if (!p.coordinates?.coordinates || (p.coordinates.coordinates[0] === 0 && p.coordinates.coordinates[1] === 0)) return;
          const [lng, lat] = p.coordinates.coordinates;
          const marker = L.marker([lat, lng]);
          marker.bindPopup(`
            <div class="map-card">
              <img src="${p.photos[0] || '/images/placeholder.svg'}" alt="" />
              <div>
                <strong>${escapeHtml(p.title)}</strong><br>
                <span style="font-size:.82rem;color:#64748b;">${escapeHtml(p.area)}, ${escapeHtml(p.state)}</span><br>
                <strong style="color:#2563eb;">${naira(p.annualRent)}</strong>
                <br><a href="/pages/property-details?id=${p._id}" style="font-size:.82rem;">View →</a>
              </div>
            </div>
          `);
          markers.addLayer(marker);
        });
        map.addLayer(markers);
      } catch (err) {
        console.warn('Map load failed:', err);
      }
    }

    map.whenReady(loadMarkers);
    map.on('moveend', loadMarkers);
  </script>
</body>
</html>
