<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />`n  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <main class="container section" style="max-width:460px;">
    <h1>Set a new password</h1>
    <form id="form" class="card" style="padding:28px;">
      <div class="form-group"><label for="password">New password (min 8)</label><input id="password" name="password" type="password" required minlength="8" /></div>
      <button class="btn btn-primary btn-block">Update password</button>
    </form>
  </main>
  <script src="/js/api.js"></script><script src="/js/components.js"></script><script src="/js/ui.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      body.token = token;
      try { await API.post('/auth/reset-password', body); toast('Password updated. Redirecting…', 'success'); setTimeout(() => location.href = '/pages/login', 1200); }
      catch (err) { toast(err.message, 'error'); }
    });
  </script>
</body>
</html>
