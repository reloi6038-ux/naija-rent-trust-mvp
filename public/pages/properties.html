<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Rentals — Naija Rent & Trust</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/favicon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em> & Trust</a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/properties">Browse Rentals</a>
        <a href="/pages/about">About</a>
        <a href="/pages/contact">Contact</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="section-head">
      <div class="eyebrow">Discover</div>
      <h1>Browse rentals</h1>
      <p class="section-sub">Filter by location, budget, and features. All listings are fictional demonstration data.</p>
    </div>

    <div class="dash" style="grid-template-columns:280px 1fr;">
      <!-- Filters (desktop) -->
      <aside class="filters-card" aria-label="Filters">
        <form id="filters">
          <div class="form-group">
            <label for="fState">State</label>
            <input id="fState" name="state" placeholder="e.g. Lagos" />
          </div>
          <div class="form-group">
            <label for="fArea">Area</label>
            <input id="fArea" name="area" placeholder="e.g. Lekki" />
          </div>
          <div class="form-group">
            <label for="fType">Property type</label>
            <select id="fType" name="propertyType">
              <option value="">Any</option>
              <option>Self Contain</option><option>Mini Flat</option><option>Flat</option>
              <option>Duplex</option><option>Detached House</option><option>Terraced House</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="fMin">Min ₦</label>
              <input id="fMin" name="minRent" type="number" />
            </div>
            <div class="form-group">
              <label for="fMax">Max ₦</label>
              <input id="fMax" name="maxRent" type="number" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="fBeds">Beds ≥</label><input id="fBeds" name="bedrooms" type="number" min="0" /></div>
            <div class="form-group"><label for="fBaths">Baths ≥</label><input id="fBaths" name="bathrooms" type="number" min="0" /></div>
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;">
              <input type="checkbox" name="verified" value="true" /> Reviewed only
            </label>
            <div class="helper">Verification badges are reviewed — .</div>
          </div>
          <div class="flex flex-col gap-1 mt-3">
            <button class="btn btn-primary btn-block" type="submit">Apply filters</button>
            <button class="btn btn-ghost btn-block" type="reset" id="clearBtn">Clear all</button>
          </div>
        </form>
      </aside>

      <!-- Results -->
      <section>
        <div class="flex-between mb-3">
          <div class="flex gap-2 items-center">
            <a class="btn btn-ghost btn-sm" href="/pages/map" style="margin-right:6px;">Map view</a><button class="btn btn-ghost btn-sm" id="openDrawer" aria-label="Open filters" style="display:none;">Filters</button>
            <div id="resultCount" class="pill" aria-live="polite">Loading…</div>
          </div>
          <div class="row">
            <label for="fSort" class="helper" style="margin:0;">Sort</label>
            <select id="fSort" name="sort" style="width:auto;padding:8px 32px 8px 12px;font-size:.88rem;">
              <option value="newest">Newest</option>
              <option value="price_asc">Price: low to high</option>
              <option value="price_desc">Price: high to low</option>
            </select>
          </div>
        </div>
        <div class="grid grid-auto" id="results"></div>
        <div class="text-center mt-4" id="loadMoreWrap"></div>
      </section>
    </div>
  </main>

  <!-- Mobile filter drawer -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Filters">
      <div class="drawer-head">
        <h3 style="margin:0;">Filters</h3>
        <button class="btn btn-ghost btn-sm" data-close aria-label="Close">✕</button>
      </div>
      <div class="drawer-body" id="drawerFilters"></div>
      <div class="drawer-foot">
        <button class="btn btn-ghost btn-block" id="drawerClear">Clear</button>
        <button class="btn btn-primary btn-block" id="drawerApply">Apply</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> Naija Rent & Trust MVP · Reviewed by NaijaRent</div></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.getElementById('filters');
    const results = document.getElementById('results');
    const count = document.getElementById('resultCount');
    const sortSel = document.getElementById('fSort');
    const drawer = document.getElementById('drawer');
    const drawerFilters = document.getElementById('drawerFilters');
    const openDrawerBtn = document.getElementById('openDrawer');

    // Mirror filters into drawer for mobile
    function mirrorToDrawer() {
      drawerFilters.innerHTML = form.innerHTML;
      // wire drawer form controls to sync with real form on apply
    }

    function buildQuery() {
      const fd = new FormData(form);
      const q = new URLSearchParams();
      for (const [k, v] of fd.entries()) if (v) q.set(k, v);
      if (sortSel.value) q.set('sort', sortSel.value);
      return q;
    }

    async function load() {
      results.innerHTML = '';
      for (let i = 0; i < 6; i++) results.appendChild(Components.skeletonCard());
      try {
        const q = buildQuery();
        const { data, pagination } = await API.get('/search/advanced?' + q.toString());
        results.innerHTML = '';
        count.textContent = `${pagination.total} listing${pagination.total === 1 ? '' : 's'} found`;
        if (!data.length) {
          results.appendChild(Components.empty({
            icon: '/images/empty-search.svg',
            title: 'No listings match your filters',
            message: 'Try broadening your search or clearing filters.',
            actionHtml: '<button class="btn btn-ghost" onclick="document.getElementById(\'clearBtn\').click()">Clear filters</button>'
          }));
          return;
        }
        data.forEach((p) => results.appendChild(Components.propertyCard(p)));
      } catch {
        results.innerHTML = '';
        results.appendChild(Components.empty({
          icon: '/images/empty-search.svg',
          title: 'Could not load listings',
          message: 'Please refresh the page.',
        }));
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = buildQuery();
      history.replaceState({}, '', '/pages/properties?' + q.toString());
      load();
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      setTimeout(() => { history.replaceState({}, '', '/pages/properties'); load(); }, 0);
    });
    sortSel.addEventListener('change', load);

    // Mobile drawer
    const mq = window.matchMedia('(max-width:900px)');
    const syncDrawerVisibility = () => {
      openDrawerBtn.style.display = mq.matches ? 'inline-flex' : 'none';
    };
    mq.addEventListener('change', syncDrawerVisibility);
    syncDrawerVisibility();

    openDrawerBtn.addEventListener('click', () => {
      mirrorToDrawer();
      drawer.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
    });
    drawer.addEventListener('click', (e) => {
      if (e.target.matches('[data-close]') || e.target === drawer) {
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
      }
      if (e.target.id === 'drawerApply') {
        // copy values from drawer into real form
        const dfs = drawer.querySelectorAll('input,select');
        const rfs = form.querySelectorAll('input,select');
        rfs.forEach((rf, i) => {
          const df = dfs[i];
          if (!df) return;
          if (rf.type === 'checkbox') rf.checked = df.checked;
          else rf.value = df.value;
        });
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        form.requestSubmit();
      }
      if (e.target.id === 'drawerClear') {
        form.reset();
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        history.replaceState({}, '', '/pages/properties');
        load();
      }
    });

    // Initial URL filter hydration
    const url = new URLSearchParams(location.search);
    url.forEach((v, k) => {
      if (k === 'sort') { sortSel.value = v; return; }
      const el = form.elements[k];
      if (!el) return;
      if (el.type === 'checkbox') el.checked = v === 'true';
      else el.value = v;
    });
    load();
  </script>
</body>
</html>
