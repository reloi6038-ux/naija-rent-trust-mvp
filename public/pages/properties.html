<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Rentals — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-i18n-title-key="meta.browse_title">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/properties" data-i18n="nav.browse">Browse rentals</a>
        <a href="/pages/map" data-i18n="nav.map">Map view</a>
        <a href="/pages/trust" data-i18n="nav.trust">Trust & Safety</a>
        <a href="/pages/about" data-i18n="nav.about">About</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <div class="lang-switcher" id="langSwitcher"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="page-header">
      <div class="container">
        <div class="eyebrow" data-i18n="browse.title">Discover</div>
        <h1 data-i18n="browse.title">Browse rentals</h1>
        <p class="section-sub" data-i18n="browse.sub">Filter by location, budget, and features. All listings are fictional demonstration data.</p>
      </div>
    </div>

    <div class="dash" style="grid-template-columns:280px 1fr;">
      <!-- Desktop Filters -->
      <aside class="filters-card" aria-label="Filters">
        <form id="filters">
          <div class="form-group">
            <label for="fState" data-i18n="hero.search_state">State</label>
            <input id="fState" name="state" data-i18n-placeholder="hero.search_state_placeholder" placeholder="e.g. Lagos" />
          </div>
          <div class="form-group">
            <label for="fArea" data-i18n="hero.search_area">Area</label>
            <input id="fArea" name="area" data-i18n-placeholder="hero.search_area_placeholder" placeholder="e.g. Lekki" />
          </div>
          <div class="form-group">
            <label for="fType">Property type</label>
            <select id="fType" name="propertyType">
              <option value="">Any</option>
              <option>Self Contain</option><option>Mini Flat</option><option>Flat</option>
              <option>Duplex</option><option>Detached House</option><option>Terraced House</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="fMin">Min ₦</label>
              <input id="fMin" name="minRent" type="number" />
            </div>
            <div class="form-group">
              <label for="fMax">Max ₦</label>
              <input id="fMax" name="maxRent" type="number" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="fBeds">Beds ≥</label><input id="fBeds" name="bedrooms" type="number" min="0" /></div>
            <div class="form-group"><label for="fBaths">Baths ≥</label><input id="fBaths" name="bathrooms" type="number" min="0" /></div>
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;">
              <input type="checkbox" name="reviewed" value="true" /> Reviewed only
            </label>
          </div>
          <div class="flex flex-col gap-1 mt-3">
            <button class="btn btn-primary btn-block" type="submit" data-i18n="browse.apply">Apply filters</button>
            <button class="btn btn-ghost btn-block" type="reset" id="clearBtn" data-i18n="browse.clear">Clear all</button>
          </div>
        </form>
      </aside>

      <!-- Results -->
      <section>
        <div class="flex-between mb-3" style="flex-wrap:wrap;gap:10px;">
          <div class="flex gap-2 items-center" style="flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" id="openDrawer" aria-label="Open filters" style="display:none;" data-i18n="browse.filters">Filters</button>
            <div id="resultCount" class="pill" aria-live="polite">Loading…</div>
            <a href="/pages/compare" class="btn btn-ghost btn-sm" style="display:none;" id="compareQuick">Compare</a>
          </div>
          <div class="flex gap-2 items-center">
            <label for="fSort" class="helper" style="margin:0;" data-i18n="browse.sort">Sort</label>
            <select id="fSort" name="sort" style="width:auto;padding:8px 32px 8px 12px;font-size:.88rem;">
              <option value="newest" data-i18n="browse.sort_newest">Newest</option>
              <option value="price_asc" data-i18n="browse.sort_price_asc">Price: low to high</option>
              <option value="price_desc" data-i18n="browse.sort_price_desc">Price: high to low</option>
              <option value="reviewed" data-i18n="browse.sort_reviewed">Recently reviewed</option>
              <option value="condition" data-i18n="browse.sort_condition">Highest condition score</option>
            </select>
            <a href="/pages/map" class="btn btn-ghost btn-sm" data-i18n="browse.map_view">Map view</a>
          </div>
        </div>
        <div class="grid grid-auto" id="results"></div>
      </section>
    </div>
  </main>

  <!-- Mobile Filter Drawer -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Filters">
      <div class="drawer-head">
        <h3 style="margin:0;" data-i18n="browse.filters">Filters</h3>
        <button class="btn btn-ghost btn-sm" data-close aria-label="Close">✕</button>
      </div>
      <div class="drawer-body" id="drawerFilters"></div>
      <div class="drawer-foot">
        <button class="btn btn-ghost btn-block" id="drawerClear" data-i18n="browse.clear">Clear</button>
        <button class="btn btn-primary btn-block" id="drawerApply" data-i18n="browse.apply">Apply</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent</div></div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/compare.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (async () => { try { await I18n.init(); } catch {} })();

    const form = document.getElementById('filters');
    const results = document.getElementById('results');
    const count = document.getElementById('resultCount');
    const sortSel = document.getElementById('fSort');
    const drawer = document.getElementById('drawer');
    const drawerFilters = document.getElementById('drawerFilters');
    const openDrawerBtn = document.getElementById('openDrawer');

    function buildQuery() {
      const fd = new FormData(form);
      const q = new URLSearchParams();
      for (const [k, v] of fd.entries()) if (v) q.set(k, v);
      if (sortSel.value) q.set('sort', sortSel.value);
      return q;
    }

    async function load() {
      results.innerHTML = '';
      for (let i = 0; i < 6; i++) results.appendChild(Components.skeletonCard());
      try {
        const q = buildQuery();
        const { data, pagination } = await API.get('/search/advanced?' + q.toString());
        results.innerHTML = '';
        count.textContent = `${pagination.total} listing${pagination.total === 1 ? '' : 's'} found`;
        if (!data.length) {
          results.appendChild(Components.empty({
            icon: '/images/empty-search.svg',
            title: 'No listings match your filters',
            message: 'Try broadening your search or clearing filters.',
            actionHtml: '<button class="btn btn-ghost" onclick="document.getElementById(\'clearBtn\').click()">Clear filters</button>'
          }));
          return;
        }
        data.forEach((p) => results.appendChild(Components.propertyCard(p)));
        updateCompareQuick();
      } catch {
        results.innerHTML = '';
        results.appendChild(Components.empty({ icon: '/images/empty-search.svg', title: 'Could not load listings', message: 'Please refresh the page.' }));
      }
    }

    function updateCompareQuick() {
      const link = document.getElementById('compareQuick');
      if (!link || typeof Compare === 'undefined') return;
      const n = Compare.count();
      link.style.display = n ? 'inline-flex' : 'none';
      link.textContent = `Compare (${n})`;
    }
    window.addEventListener('compare:updated', updateCompareQuick);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      history.replaceState({}, '', '/pages/properties?' + buildQuery().toString());
      load();
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      setTimeout(() => { history.replaceState({}, '', '/pages/properties'); load(); }, 0);
    });
    sortSel.addEventListener('change', load);

    const mq = window.matchMedia('(max-width:900px)');
    const syncDrawerVisibility = () => { openDrawerBtn.style.display = mq.matches ? 'inline-flex' : 'none'; };
    mq.addEventListener('change', syncDrawerVisibility);
    syncDrawerVisibility();

    openDrawerBtn.addEventListener('click', () => {
      drawerFilters.innerHTML = form.innerHTML;
      drawer.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
    });
    drawer.addEventListener('click', (e) => {
      if (e.target.matches('[data-close]') || e.target === drawer) {
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
      }
      if (e.target.id === 'drawerApply') {
        const dfs = drawer.querySelectorAll('input,select');
        const rfs = form.querySelectorAll('input,select');
        rfs.forEach((rf, i) => {
          const df = dfs[i];
          if (!df) return;
          if (rf.type === 'checkbox') rf.checked = df.checked;
          else rf.value = df.value;
        });
        drawer.classList.remove('open');
        form.requestSubmit();
      }
      if (e.target.id === 'drawerClear') {
        form.reset();
        drawer.classList.remove('open');
        history.replaceState({}, '', '/pages/properties');
        load();
      }
    });

    // Hydrate
    const url = new URLSearchParams(location.search);
    url.forEach((v, k) => {
      if (k === 'sort') { sortSel.value = v; return; }
      const el = form.elements[k];
      if (!el) return;
      if (el.type === 'checkbox') el.checked = v === 'true';
      else el.value = v;
    });
    load();
  </script>
</body>
</html>
