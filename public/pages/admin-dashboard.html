<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <img src="/images/logo-mark.svg" alt="" width="32" height="32" />
        Naija<em>Rent</em>
      </a>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="dash">
      <aside class="side" aria-label="Admin navigation">
        <a href="/pages/admin-dashboard" class="active">Dashboard</a>
        <a href="/pages/admin-review">Review queue</a>
        <a href="/pages/reports">Reports</a>
        <a href="/pages/verification">Review flags</a>
      </aside>
      <div>
        <div class="flex-between mb-3">
          <div>
            <div class="eyebrow">Admin</div>
            <h1 style="margin:0;">Overview</h1>
          </div>
        </div>

        <div class="stats-grid" id="stats"></div>

        <div class="section-head mt-4">
          <h2>Quick actions</h2>
        </div>
        <div class="grid grid-2">
          <a href="/pages/admin-review" class="card" style="padding:24px;text-decoration:none;">
            <h3 style="margin:0 0 6px;">🔍 Review queue <span id="pendingBadge" class="pill badge-new" style="margin-left:8px;display:none;">0</span></h3>
            <p class="text-muted" style="margin:0;">Approve or reject listings awaiting review.</p>
          </a>
          <a href="/pages/reports" class="card" style="padding:24px;text-decoration:none;">
            <h3 style="margin:0 0 6px;">🚩 Report queue</h3>
            <p class="text-muted" style="margin:0;">Review reported listings and take action.</p>
          </a>
          <a href="/pages/verification" class="card" style="padding:24px;text-decoration:none;">
            <h3 style="margin:0 0 6px;">✅ Review flags</h3>
            <p class="text-muted" style="margin:0;">Toggle manual-review flags (audit-logged).</p>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async () => {
      try {
        const { stats } = await API.get('/admin/stats');

        const labelMap = {
          total: 'Total properties',
          published: 'Published',
          rented: 'Rented',
          unpublished: 'Unpublished',
          pending: 'Pending review',
          rejected: 'Rejected',
          openReports: 'Open reports',
          reviewedReports: 'Reviewed',
          dismissedReports: 'Dismissed',
          enquiries: 'Enquiries',
          reviewed: 'Reviewed listings',
          listers: 'Listers'
        };
        const variantMap = {
          published: 'accent',
          rented: 'warn',
          unpublished: 'danger',
          pending: '',
          rejected: 'danger',
          openReports: 'danger',
          reviewedReports: 'accent'
        };

        const el = document.getElementById('stats');
        Object.entries(stats).forEach(([k, v]) => {
          if (typeof v === 'number') {
            el.appendChild(Components.statCard({ value: v, label: labelMap[k] || k, variant: variantMap[k] || '' }));
          }
        });

        // Show pending badge
        if (stats.pending > 0) {
          const badge = document.getElementById('pendingBadge');
          badge.textContent = stats.pending;
          badge.style.display = 'inline-block';
        }
      } catch (e) {
        toast(e.message, 'error');
        window.location.href = '/pages/admin-login';
      }
    })();
  </script>
</body>
</html>
