<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <style>
    .admin-layout { display: grid; grid-template-columns: 260px 1fr; gap: 30px; align-items: start; }
    @media (max-width: 900px) { .admin-layout { grid-template-columns: 1fr; } }
    
    .admin-sidebar { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; position: sticky; top: 100px; box-shadow: var(--shadow-sm); }
    .admin-sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: var(--ink-700); font-weight: 600; margin-bottom: 4px; transition: all 0.2s; }
    .admin-sidebar a:hover { background: var(--ink-50); color: var(--brand-500); }
    .admin-sidebar a.active { background: var(--brand-50); color: var(--brand-500); border-left: 3px solid var(--brand-500); }
    
    @media (max-width: 900px) {
      .admin-sidebar { display: flex; overflow-x: auto; padding: 10px; position: static; white-space: nowrap; }
      .admin-sidebar a { margin-bottom: 0; border-left: none; border-bottom: 3px solid transparent; }
      .admin-sidebar a.active { border-left: none; border-bottom-color: var(--brand-500); }
    }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: var(--shadow-sm); border-top: 4px solid var(--brand-500); }
    .stat-box.accent { border-top-color: var(--accent-500); }
    .stat-box.warn { border-top-color: var(--warn-500); }
    .stat-box.danger { border-top-color: var(--danger-500); }
    .stat-box .v { font-size: 2rem; font-weight: 800; color: var(--ink-900); line-height: 1.1; }
    .stat-box .l { font-size: 0.85rem; color: var(--ink-500); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; }
    
    .dashboard-split { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 1024px) { .dashboard-split { grid-template-columns: 1fr; } }
    
    .activity-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .activity-card h3 { font-size: 1.1rem; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .activity-item { padding: 12px 0; border-bottom: 1px solid var(--ink-100); display: flex; justify-content: space-between; align-items: center; }
    .activity-item:last-child { border-bottom: none; }
    .activity-item a { font-weight: 600; color: var(--ink-900); font-size: 0.95rem; }
    .activity-item .time { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/admin-dashboard" class="active">Admin Panel</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <div class="lang-switcher" id="langSwitcher"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="admin-layout">
      <!-- Sidebar -->
      <aside class="admin-sidebar">
        <a href="/pages/admin-dashboard" class="active">📊 Overview</a>
        <a href="/pages/admin-review">📝 Listing Reviews <span id="pendingBadge" class="pill badge-new" style="margin-left:auto; display:none;">0</span></a>
        <a href="/pages/reports">🚩 Reports</a>
        <a href="/pages/verification">✅ Verifications</a>
        <a href="/pages/contact-messages">✉️ Messages</a>
      </aside>

      <!-- Main Content -->
      <div>
        <div class="flex-between mb-4">
          <div>
            <h1 style="margin:0;">Platform Overview</h1>
            <p class="section-sub" style="margin:4px 0 0;">Real-time statistics and moderation status.</p>
          </div>
          <a href="/pages/properties" class="btn btn-ghost btn-sm" target="_blank">View Live Site ↗</a>
        </div>

        <!-- Stats Row -->
        <div class="stat-grid" id="stats">
          <div class="skeleton" style="height:100px; border-radius:12px;"></div>
          <div class="skeleton" style="height:100px; border-radius:12px;"></div>
          <div class="skeleton" style="height:100px; border-radius:12px;"></div>
        </div>

        <!-- Priority & Activity Split -->
        <div class="dashboard-split">
          <!-- Needs Attention -->
          <div class="activity-card">
            <h3>🚨 Needs Attention</h3>
            <div id="needsAttention">
              <div class="skeleton" style="height:60px; margin-bottom:8px;"></div>
              <div class="skeleton" style="height:60px;"></div>
            </div>
          </div>

          <!-- Recent Activity -->
          <div class="activity-card">
            <h3>📋 Recent Reports</h3>
            <div id="recentReports">
              <div class="skeleton" style="height:60px; margin-bottom:8px;"></div>
              <div class="skeleton" style="height:60px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent Admin</div></div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (async () => { try { await I18n.init(); } catch {} })();

    (async () => {
      try {
        const [statsRes, activityRes] = await Promise.all([
          API.get('/admin/stats'),
          API.get('/admin/recent-activity')
        ]);
        
        const stats = statsRes.stats;
        
        // 1. Render Stats
        const statMap = [
          { key: 'published', label: 'Published', class: 'accent' },
          { key: 'pending', label: 'Pending Review', class: 'warn' },
          { key: 'openReports', label: 'Open Reports', class: 'danger' },
          { key: 'enquiries', label: 'Total Enquiries', class: '' }
        ];

        const el = document.getElementById('stats');
        el.innerHTML = statMap.map(s => `
          <div class="stat-box ${s.class}">
            <div class="v">${stats[s.key] || 0}</div>
            <div class="l">${s.label}</div>
          </div>
        `).join('');

        // 2. Render Pending Badge
        if (stats.pending > 0) {
          const badge = document.getElementById('pendingBadge');
          badge.textContent = stats.pending;
          badge.style.display = 'inline-block';
        }

        // 3. Render Needs Attention (Pending Listings)
        const attentionEl = document.getElementById('needsAttention');
        if (!activityRes.recentPending.length) {
          attentionEl.innerHTML = '<p class="text-muted" style="margin:0;">All clear! No pending listings.</p>';
        } else {
          attentionEl.innerHTML = activityRes.recentPending.map(p => `
            <div class="activity-item">
              <div>
                <a href="/pages/property-details?id=${p._id}" target="_blank">${escapeHtml(p.title)}</a>
                <div class="time">By ${escapeHtml(p.lister.name)}</div>
              </div>
              <a href="/pages/admin-review" class="btn btn-sm btn-primary">Review</a>
            </div>
          `).join('');
        }

        // 4. Render Recent Reports
        const reportsEl = document.getElementById('recentReports');
        if (!activityRes.recentReports.length) {
          reportsEl.innerHTML = '<p class="text-muted" style="margin:0;">No open reports. Good job!</p>';
        } else {
          reportsEl.innerHTML = activityRes.recentReports.map(r => `
            <div class="activity-item">
              <div>
                <a href="/pages/property-details?id=${r.property?._id}" target="_blank">${escapeHtml(r.property?.title || 'Deleted Listing')}</a>
                <div class="time">${escapeHtml(r.reason)}</div>
              </div>
              <a href="/pages/reports" class="btn btn-sm btn-ghost">View</a>
            </div>
          `).join('');
        }

      } catch (e) {
        toast('Admin access required', 'error'); 
        window.location.href = '/pages/admin-login';
      }
    })();
  </script>
</body>
</html>
