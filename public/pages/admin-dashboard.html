<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <style>
    .admin-layout { display: grid; grid-template-columns: 260px 1fr; gap: 30px; align-items: start; }
    @media (max-width: 900px) { .admin-layout { grid-template-columns: 1fr; } }
    
    .admin-sidebar { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; position: sticky; top: 100px; box-shadow: var(--shadow-sm); }
    .admin-sidebar button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; border-radius: 8px; color: var(--ink-700); font-weight: 600; margin-bottom: 4px; transition: all 0.2s; border: none; background: transparent; cursor: pointer; font-size: 1rem; }
    .admin-sidebar button:hover { background: var(--ink-50); color: var(--brand-500); }
    .admin-sidebar button.active { background: var(--brand-50); color: var(--brand-500); border-left: 3px solid var(--brand-500); }
    
    @media (max-width: 900px) {
      .admin-sidebar { display: flex; overflow-x: auto; padding: 10px; position: static; white-space: nowrap; }
      .admin-sidebar button { margin-bottom: 0; border-left: none; border-bottom: 3px solid transparent; }
      .admin-sidebar button.active { border-left: none; border-bottom-color: var(--brand-500); }
    }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-sm); border-top: 4px solid var(--brand-500); }
    .stat-box .v { font-size: 1.8rem; font-weight: 800; color: var(--ink-900); }
    .stat-box .l { font-size: 0.85rem; color: var(--ink-500); font-weight: 600; text-transform: uppercase; margin-top: 6px; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary"><a href="/pages/admin-dashboard" class="active">Admin Panel</a></nav>
      <div class="nav-actions" id="navActions"></div>
      <div class="lang-switcher" id="langSwitcher"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="admin-layout">
      <!-- Sidebar Navigation -->
      <aside class="admin-sidebar">
        <button data-tab="overview" class="active">📊 Overview</button>
        <button data-tab="listings">🏠 Manage Listings <span id="pendingBadge" class="pill badge-new" style="margin-left:auto; display:none;">0</span></button>
        <button data-tab="testimonials">⭐ Testimonials</button>
        <button data-tab="messages">✉️ Messages</button>
      </aside>

      <!-- Main Content Area -->
      <div>
        <!-- TAB: OVERVIEW -->
        <div id="tab-overview" class="tab-content active">
          <h1 style="margin-bottom:24px;">Platform Overview</h1>
          <div class="stat-grid" id="statsContainer">
            <div class="skeleton" style="height:100px; border-radius:12px;"></div>
            <div class="skeleton" style="height:100px; border-radius:12px;"></div>
          </div>
        </div>

        <!-- TAB: MANAGE LISTINGS -->
        <div id="tab-listings" class="tab-content">
          <div class="flex-between mb-4">
            <h1 style="margin:0;">Manage Listings</h1>
            <a href="/pages/admin-review" class="btn btn-primary btn-sm">Review Pending</a>
          </div>
          <div id="listingsContainer" class="card" style="padding:0; overflow:hidden;">
            <div class="skeleton" style="height:300px;"></div>
          </div>
        </div>

        <!-- TAB: TESTIMONIALS -->
        <div id="tab-testimonials" class="tab-content">
          <h1 style="margin-bottom:24px;">Manage Testimonials</h1>
          <div id="testimonialsContainer" class="grid grid-2"></div>
        </div>

        <!-- TAB: MESSAGES -->
        <div id="tab-messages" class="tab-content">
          <h1 style="margin-bottom:24px;">Contact Messages</h1>
          <div id="messagesContainer"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent Admin</div></div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (async () => { try { await I18n.init(); } catch {} })();

    // Tab Switching Logic
    document.querySelectorAll('.admin-sidebar button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.admin-sidebar button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // --- 1. Load Overview Stats ---
    (async () => {
      try {
        const { stats } = await API.get('/admin/stats');
        document.getElementById('statsContainer').innerHTML = `
          <div class="stat-box"><div class="v">${stats.published}</div><div class="l">Published</div></div>
          <div class="stat-box" style="border-top-color:var(--warn-500);"><div class="v">${stats.pending}</div><div class="l">Pending Review</div></div>
          <div class="stat-box" style="border-top-color:var(--danger-500);"><div class="v">${stats.openReports}</div><div class="l">Open Reports</div></div>
          <div class="stat-box"><div class="v">${stats.enquiries}</div><div class="l">Enquiries</div></div>
        `;
        if (stats.pending > 0) {
          const badge = document.getElementById('pendingBadge');
          badge.textContent = stats.pending;
          badge.style.display = 'inline-block';
        }
      } catch { toast('Admin access required', 'error'); window.location.href = '/pages/admin-login'; }
    })();

    // --- 2. Load All Listings ---
    (async () => {
      try {
        const { data } = await API.get('/admin/properties');
        const el = document.getElementById('listingsContainer');
        if (!data.length) { el.innerHTML = '<p class="text-center" style="padding:40px;">No listings found.</p>'; return; }
        
        el.innerHTML = `<div class="table-wrap"><table class="table">
          <thead><tr><th>Property</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${data.map(p => `
              <tr>
                <td>
                  <strong>${escapeHtml(p.title)}</strong><br>
                  <span class="text-muted" style="font-size:.85rem;">${escapeHtml(p.area)}, ${escapeHtml(p.state)}</span>
                </td>
                <td><span class="pill badge-${p.status.toLowerCase()}">${p.status}</span></td>
                <td style="white-space:nowrap;">
                  <a href="/pages/property-details?id=${p._id}" target="_blank" class="btn btn-sm btn-ghost" title="View">👁️</a>
                  <a href="/pages/edit-listing?id=${p._id}" class="btn btn-sm btn-ghost" title="Edit">✏️</a>
                  ${p.status !== 'Unpublished' ? `<button class="btn btn-sm btn-ghost" data-unpub="${p._id}" title="Unpublish">🚫</button>` : ''}
                  <button class="btn btn-sm btn-ghost" style="color:var(--danger-500);" data-delete="${p._id}" title="Delete">🗑️</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table></div>`;

        // Wire Delete & Unpublish
        el.querySelectorAll('[data-delete]').forEach(b => b.onclick = async () => {
          if (!confirm('Are you sure? This will permanently delete the listing.')) return;
          await API.del('/admin/properties/' + b.dataset.delete);
          toast('Listing deleted', 'success'); setTimeout(() => location.reload(), 500);
        });
        el.querySelectorAll('[data-unpub]').forEach(b => b.onclick = async () => {
          if (!confirm('Unpublish this listing?')) return;
          await API.patch('/admin/properties/' + b.dataset.unpub + '/unpublish', { adminNote: 'Unpublished by admin' });
          toast('Listing unpublished', 'success'); setTimeout(() => location.reload(), 500);
        });

      } catch { document.getElementById('listingsContainer').innerHTML = 'Error loading listings.'; }
    })();

    // --- 3. Load Testimonials ---
    (async () => {
      try {
        const { data } = await API.get('/testimonials/admin');
        const el = document.getElementById('testimonialsContainer');
        if (!data.length) { el.innerHTML = '<p class="text-muted" style="grid-column:1/-1;">No testimonials submitted yet.</p>'; return; }
        
        el.innerHTML = data.map(t => `
          <div class="card" style="padding:20px; border-left: 4px solid ${t.status === 'Approved' ? 'var(--accent-500)' : t.status === 'Rejected' ? 'var(--danger-500)' : 'var(--warn-500)'};">
            <div class="flex-between mb-2">
              <strong>${escapeHtml(t.name)}</strong>
              <span class="pill badge-${t.status.toLowerCase()}">${t.status}</span>
            </div>
            <div style="color:var(--warn-500); font-size:.9rem; margin-bottom:8px;">${'⭐'.repeat(t.rating)}</div>
            <p style="font-size:.9rem; color:var(--ink-700); font-style:italic;">"${escapeHtml(t.quote)}"</p>
            ${t.status === 'Pending' ? `
              <div class="flex gap-2 mt-3">
                <button class="btn btn-sm btn-primary" data-approve="${t._id}">Approve</button>
                <button class="btn btn-sm btn-ghost" data-reject="${t._id}">Reject</button>
              </div>
            ` : ''}
          </div>
        `).join('');

        el.querySelectorAll('[data-approve]').forEach(b => b.onclick = async () => {
          await API.patch('/testimonials/' + b.dataset.approve + '/status', { status: 'Approved' });
          toast('Approved', 'success'); setTimeout(() => location.reload(), 500);
        });
        el.querySelectorAll('[data-reject]').forEach(b => b.onclick = async () => {
          await API.patch('/testimonials/' + b.dataset.reject + '/status', { status: 'Rejected' });
          toast('Rejected', 'success'); setTimeout(() => location.reload(), 500);
        });
      } catch {}
    })();

    // --- 4. Load Messages ---
    (async () => {
      try {
        const { data } = await API.get('/contacts');
        const el = document.getElementById('messagesContainer');
        if (!data.length) { el.innerHTML = '<p class="text-muted">No messages yet.</p>'; return; }
        
        el.innerHTML = data.map(m => `
          <div class="card mb-3" style="padding:20px; border-left: 4px solid ${m.status === 'New' ? 'var(--brand-500)' : 'var(--border)'};">
            <div class="flex-between mb-2">
              <strong style="font-size:1.1rem;">${escapeHtml(m.subject)}</strong>
              <span class="pill ${m.status === 'New' ? 'badge-new' : ''}">${m.status}</span>
            </div>
            <div class="text-muted mb-2" style="font-size:.9rem;">From: ${escapeHtml(m.name)} &lt;${escapeHtml(m.email)}&gt;</div>
            <p style="background:var(--ink-50); padding:12px; border-radius:8px; font-size:.95rem;">${escapeHtml(m.message)}</p>
            ${m.status === 'New' ? `<button class="btn btn-sm btn-ghost" data-read="${m._id}">Mark as Read</button>` : ''}
            <a href="mailto:${escapeHtml(m.email)}?subject=Re: ${escapeHtml(m.subject)}" class="btn btn-sm btn-primary" style="margin-left:8px;">Reply</a>
          </div>
        `).join('');

        el.querySelectorAll('[data-read]').forEach(b => b.onclick = async () => {
          await API.patch('/contacts/' + b.dataset.read + '/read', {});
          toast('Marked as read', 'success'); setTimeout(() => location.reload(), 500);
        });
      } catch {}
    })();
  </script>
</body>
</html>
