<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/properties" data-i18n="nav.browse">Browse rentals</a>
        <a href="/pages/map" data-i18n="nav.map">Map view</a>
        <a href="/pages/trust" data-i18n="nav.trust">Trust & Safety</a>
        <a href="/pages/about" data-i18n="nav.about">About</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <div class="lang-switcher" id="langSwitcher"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section" style="max-width:640px;">
    <div class="page-header" style="background: transparent; padding: 0; margin-bottom: 24px; text-align:center;">
      <div class="eyebrow">Support</div>
      <h1>Contact Us</h1>
      <p class="section-sub">Questions about a listing, account, or reporting suspicious activity? We're here to help.</p>
    </div>

    <form id="contactForm" class="card" style="padding:32px;">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input id="name" name="name" required placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">Choose a topic…</option>
          <option>General Enquiry</option>
          <option>Report a Listing</option>
          <option>Account Issue</option>
          <option>Technical Bug</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="How can we help you?" style="min-height:150px;"></textarea>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send Message</button>
    </form>

    <div style="text-align:center; margin-top:32px;" class="text-muted">
      <p>Or email us directly at <a href="mailto:support@naijarent.com">support@naijarent.com</a></p>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent</div></div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/forms.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (async () => { try { await I18n.init(); } catch {} })();

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!Forms.validate(e.target)) return;
      
      const body = Object.fromEntries(new FormData(e.target));
      const btn = e.target.querySelector('button[type="submit"]');
      const origText = btn.textContent;
      btn.textContent = 'Sending…';
      btn.disabled = true;

      try {
        await API.post('/contacts', body);
        toast('Message sent successfully! We will reply shortly.', 'success');
        e.target.reset();
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
