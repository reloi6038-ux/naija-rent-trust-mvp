<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Property Details — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/properties">Browse rentals</a>
        <a href="/pages/about">About</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div id="root">
      <div class="skeleton" style="height:400px;border-radius:20px;"></div>
    </div>

    <section class="section-sm" id="conditionSection" style="display:none;">
      <div class="divider-label">Renter condition reports</div>
      <div class="grid grid-2" style="gap:24px;">
        <div>
          <h3 style="margin:0 0 12px;font-size:1.1rem;">What renters found</h3>
          <div id="conditionSummary"></div>
        </div>
        <div class="card" style="padding:22px;">
          <h3 style="margin:0 0 8px;font-size:1.05rem;">Report condition</h3>
          <form id="conditionForm">
            <div id="checklistInputs"></div>
            <div class="form-group" style="margin-top:14px;">
              <label for="condRating">Overall rating (1–5)</label>
              <input id="condRating" name="overallRating" type="number" min="1" max="5" />
            </div>
            <div class="form-group">
              <label for="condVisited">Date you visited</label>
              <input id="condVisited" name="visitedAt" type="date" />
            </div>
            <div class="form-group">
              <label for="condNotes">Notes (optional)</label>
              <textarea id="condNotes" name="notes" maxlength="800"></textarea>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Submit report</button>
          </form>
        </div>
      </div>
    </section>

    <section class="section-sm" id="priceHistorySection" style="display:none;">
      <div class="divider-label">Price history</div>
      <div class="card" style="padding:22px;">
        <div id="priceHistoryList"></div>
      </div>
    </section>
  </main>

  <!-- Modals -->
  <div class="modal-backdrop" id="enquiryModal" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Send an enquiry</h3>
      <form id="enquiryForm">
        <div class="form-group"><label>Name</label><input name="renterName" required /></div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input name="renterPhone" required /></div>
          <div class="form-group"><label>Email</label><input name="renterEmail" type="email" required /></div>
        </div>
        <div class="form-group"><label>Preferred date</label><input name="preferredInspectionDate" type="date" /></div>
        <div class="form-group"><label>Message</label><textarea name="message"></textarea></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" onclick="document.getElementById('enquiryModal').classList.remove('open')">Cancel</button>
          <button class="btn btn-primary" type="submit">Send enquiry</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="reportModal" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>Report this listing</h3>
      <form id="reportForm">
        <div class="form-group">
          <label>Reason</label>
          <select name="reason" required>
            <option value="">Choose…</option>
            <option>Fake listing</option><option>Wrong price</option>
            <option>Already rented</option><option>Suspicious agent</option><option>Other</option>
          </select>
        </div>
        <div class="form-group"><label>Comments</label><textarea name="comment"></textarea></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" onclick="document.getElementById('reportModal').classList.remove('open')">Cancel</button>
          <button class="btn btn-danger" type="submit">Submit report</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent</div></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/compare.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/forms.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const id = new URLSearchParams(location.search).get('id');
    const root = document.getElementById('root');

    (async () => {
      if (!id) { root.innerHTML = '<div class="empty"><p>Missing listing id.</p></div>'; return; }
      try {
        const { property: p } = await API.get('/properties/' + id);
        render(p);
      } catch (e) {
        root.innerHTML = `
          <div class="empty" style="max-width:480px; margin:40px auto; text-align:center;">
            <img src="/images/empty-search.svg" alt="" style="max-width:180px; margin:0 auto 20px;" />
            <h3>Listing unavailable</h3>
            <p style="color:var(--ink-500); margin-bottom:24px;">This property may have been rented, unpublished, or the link is incorrect.</p>
            <a class="btn btn-primary" href="/pages/properties">Browse other listings</a>
          </div>`;
      }
    })();

    function render(p) {
      // Bulletproofing: Safely handle missing arrays
      const photos = (p.photos && p.photos.length) ? p.photos : ['/images/placeholder.svg'];
      const amenities = p.amenities || [];
      const condScore = p.conditionScore || 0;
      const condReports = p.conditionReports || [];
      const priceHistory = p.priceHistory || [];

      root.innerHTML = `
        <nav aria-label="Breadcrumb" class="mb-2">
          <a href="/pages/properties" style="color:var(--text-muted);font-size:.88rem;">← Back to listings</a>
        </nav>

        <div class="dash" style="grid-template-columns:minmax(0,1fr) 380px;">
          <div>
            <div class="gallery" id="gallery">
              <img id="heroImg" src="${photos[0]}" alt="${escapeHtml(p.title)}" style="width:100%;height:100%;object-fit:cover;" />
            </div>
            
            <div class="gallery-thumbs" id="thumbs" aria-label="Photo thumbnails">
              ${photos.map((ph, i) => `
                <button class="${i === 0 ? 'active' : ''}" data-src="${ph}" aria-label="Photo ${i + 1}">
                  <img src="${ph}" alt="" loading="lazy" />
                </button>`).join('')}
            </div>

            <div class="mt-3">
              <h1 style="margin-top:8px;">${escapeHtml(p.title)}</h1>
              <div class="text-muted mb-3">${escapeHtml(p.area)}, ${escapeHtml(p.state)}${p.address ? ' · ' + escapeHtml(p.address) : ''}</div>
              ${p.lister ? `
                <div class="flex items-center gap-2 mb-3" style="flex-wrap:wrap;">
                  <a href="/pages/lister-profile?id=${p.lister._id}" class="btn btn-ghost btn-sm">
                    👤 View lister profile
                  </a>
                </div>` : ''}

              <div class="row gap-3 mb-3" style="flex-wrap:wrap;color:var(--ink-700);font-weight:600;">
                <span class="pill">🛏 ${p.bedrooms} bed</span>
                <span class="pill">🚿 ${p.bathrooms} bath</span>
                <span class="pill">🏠 ${escapeHtml(p.propertyType)}</span>
              </div>

              <h2 style="font-size:1.2rem;">Description</h2>
              <p style="white-space:pre-line;">${escapeHtml(p.description)}</p>

              ${amenities.length ? `
                <h2 class="mt-3" style="font-size:1.2rem;">Amenities</h2>
                <div class="flex gap-1 flex-wrap mb-3">
                  ${amenities.map((a) => `<span class="pill">${escapeHtml(a)}</span>`).join('')}
                </div>` : ''}
            </div>
          </div>

          <aside>
            <div class="sticky-card">
              <div class="text-muted" style="font-size:.85rem;">Annual Rent</div>
              <div style="font-size:2rem;font-weight:800;color:var(--brand-500);letter-spacing:-.02em;">${naira(p.annualRent)}</div>

              <hr class="mt-2 mb-2" />

              <table class="fee-table" aria-label="Fee breakdown">
                <tr><td>Agency fee</td><td>${naira(p.agencyFee)}</td></tr>
                <tr><td>Legal fee</td><td>${naira(p.legalFee)}</td></tr>
                <tr><td>Caution deposit</td><td>${naira(p.cautionDeposit)}</td></tr>
                <tr class="total"><td>Total move-in</td><td>${naira(p.totalMoveInCost)}</td></tr>
              </table>

              ${condScore > 0 ? `
                <div class="mt-3" style="display:flex;align-items:center;gap:8px;padding:10px;background:var(--ink-50);border-radius:10px;">
                  <span style="font-size:1.2rem;">🏚️</span>
                  <div>
                    <div style="font-weight:600;font-size:.9rem;">Condition score ${condScore.toFixed(1)} / 5</div>
                    <div class="helper" style="margin:0;">From ${condReports.length} renter report${condReports.length === 1 ? '' : 's'}</div>
                  </div>
                </div>` : ''}

              <button class="btn btn-primary btn-block mt-3" onclick="document.getElementById('enquiryModal').classList.add('open')">Send enquiry</button>
              <button class="btn btn-ghost btn-block mt-2" onclick="document.getElementById('reportModal').classList.add('open')">Report listing</button>
            </div>
          </aside>
        </div>
      `;

      const heroImg = document.getElementById('heroImg');
      document.querySelectorAll('#thumbs button').forEach((btn) => {
        btn.addEventListener('click', () => {
          heroImg.style.opacity = '0.3';
          heroImg.src = btn.dataset.src;
          heroImg.onload = () => { heroImg.style.opacity = '1'; };
          document.querySelectorAll('#thumbs button').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      // Condition Checklist
      (async () => {
        try {
          const [{ checks }, { totalReports, averageScore, byCheck }] = await Promise.all([
            API.get(`/properties/${id}/conditions/checklist`),
            API.get(`/properties/${id}/conditions/summary`)
          ]);
          document.getElementById('conditionSection').style.display = 'block';
          const inputs = document.getElementById('checklistInputs');
          inputs.innerHTML = checks.map(c => `
            <div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.9rem;">
              <span style="flex:1;">${escapeHtml(c.label)}</span>
              <select name="check_${c.key}" style="width:auto;padding:4px 8px;font-size:.8rem;">
                <option value="Not checked">—</option><option value="OK">OK</option><option value="Issues">Issues</option>
              </select>
            </div>
          `).join('');
          
          const summary = document.getElementById('conditionSummary');
          if (!totalReports) {
            summary.innerHTML = `<p class="text-muted">No condition reports yet.</p>`;
          } else {
            summary.innerHTML = `
              <div class="flex gap-2 mb-2" style="flex-wrap:wrap;">
                <span class="pill badge-published">${totalReports} report${totalReports > 1 ? 's' : ''}</span>
                <span class="pill">Avg ${averageScore.toFixed(1)}/5</span>
              </div>
              ${byCheck.map(c => {
                const okPct = c.total ? Math.round((c.OK / c.total) * 100) : 0;
                return `<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:2px;"><span>${escapeHtml(c.label)}</span><span>${c.OK}/${c.total} OK</span></div><div class="progress"><div class="progress-bar" style="width:${okPct}%;"></div></div></div>`;
              }).join('')}
            `;
          }
        } catch (err) {}
      })();

      // Price History
      if (priceHistory.length) {
        const section = document.getElementById('priceHistorySection');
        section.style.display = 'block';
        const sorted = [...priceHistory].sort((a, b) => new Date(a.at) - new Date(b.at));
        document.getElementById('priceHistoryList').innerHTML = sorted.map((h, i) => `
          <div style="display:flex;justify-content:space-between;padding:10px 0;${i ? 'border-top:1px solid var(--ink-100);' : ''}">
            <div>
              <div style="font-weight:600;">${naira(h.annualRent)} / yr</div>
              <div style="font-size:.8rem;color:var(--ink-500);">${new Date(h.at).toLocaleDateString()} · ${escapeHtml(h.reason || 'Updated')}</div>
            </div>
            <div style="font-weight:600;color:var(--accent-600);">${naira(h.totalMoveInCost)}</div>
          </div>
        `).join('');
      }
    }

    document.getElementById('enquiryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      body.propertyId = id;
      try {
        await API.post('/enquiries', body);
        document.getElementById('enquiryModal').classList.remove('open');
        e.target.reset();
        toast('Enquiry sent successfully', 'success');
      } catch (err) { toast(err.message, 'error'); }
    });

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      body.propertyId = id;
      try {
        await API.post('/reports', body);
        document.getElementById('reportModal').classList.remove('open');
        e.target.reset();
        toast('Report submitted', 'success');
      } catch (err) { toast(err.message, 'error'); }
    });
  </script>
</body>
</html>
