<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enquiries — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/lister-dashboard">Dashboard</a>
        <a href="/pages/enquiries" class="active">Enquiries</a>
        <a href="/pages/properties">Browse</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="page-header" style="background: transparent; padding: 0; margin-bottom: 24px;">
      <div class="eyebrow">Inbox</div>
      <h1 style="margin:0;">Enquiries</h1>
      <p class="section-sub" style="margin:4px 0 0;">Messages from renters about your listings.</p>
    </div>

    <div id="list"></div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent</div></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (async () => {
      try {
        const { data } = await API.get('/enquiries/mine');
        const el = document.getElementById('list');
        
        if (!data.length) {
          el.innerHTML = `<div class="empty"><img src="/images/empty-listings.svg" alt="" style="max-width:200px;margin:0 auto 16px;" /><h3>No enquiries yet</h3><p>When renters contact you, their messages will appear here.</p></div>`;
          return;
        }

        const byProp = data.reduce((acc, e) => {
          const k = e.property?._id || 'removed';
          (acc[k] = acc[k] || { title: e.property?.title || 'Removed listing', items: [] }).items.push(e);
          return acc;
        }, {});

        el.innerHTML = Object.entries(byProp).map(([pid, group]) => `
          <div class="card mb-3" style="padding:24px; border: 1px solid var(--border);">
            <h3 style="margin:0 0 16px; font-size:1.15rem; color:var(--ink-900);">${escapeHtml(group.title)}</h3>
            ${group.items.map((e) => `
              <div style="border-top:1px solid var(--border); padding:16px 0;">
                <div class="flex-between mb-1" style="gap:12px;flex-wrap:wrap; align-items: flex-start;">
                  <div class="flex gap-2">
                    <div class="avatar">${escapeHtml(e.renterName.split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase())}</div>
                    <div>
                      <div style="font-weight:700; color:var(--ink-900);">${escapeHtml(e.renterName)}</div>
                      <div class="text-muted" style="font-size:.85rem;">${escapeHtml(e.renterPhone)} · <a href="mailto:${escapeHtml(e.renterEmail)}">${escapeHtml(e.renterEmail)}</a></div>
                    </div>
                  </div>
                  <span class="pill ${e.status === 'New' ? 'badge-new' : 'badge-contacted'}">${e.status}</span>
                </div>
                ${e.preferredInspectionDate ? `<div class="helper">Inspection preferred: ${new Date(e.preferredInspectionDate).toLocaleDateString()}</div>` : ''}
                <p style="margin:10px 0; font-size:.95rem; color:var(--ink-700); background: var(--ink-50); padding: 12px; border-radius: 8px;">${escapeHtml(e.message || 'No message provided.')}</p>
                ${e.status === 'New' ? `<button class="btn btn-sm btn-primary mt-1" data-contact="${e._id}">Mark as Contacted</button>` : ''}
              </div>
            `).join('')}
          </div>
        `).join('');

        el.querySelectorAll('[data-contact]').forEach((b) => b.addEventListener('click', async () => {
          try {
            await API.patch('/enquiries/' + b.dataset.contact + '/contacted', {});
            toast('Enquiry marked as contacted', 'success');
            setTimeout(() => location.reload(), 500);
          } catch (err) { toast(err.message, 'error'); }
        }));
      } catch (e) {
        toast(e.message, 'error');
        window.location.href = '/pages/login';
      }
    })();
  </script>
</body>
</html>
