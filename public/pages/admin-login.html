<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />`n  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <main id="main" class="container section" style="max-width:440px;">
    <div class="section-head">
      <div class="eyebrow">Admin</div>
      <h1>Admin sign in</h1>
      <p class="section-sub">Restricted access. Admin accounts only.</p>
    </div>

    <form id="form" class="card" style="padding:28px;" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
      </div>
      <div class="form-group hidden" id="totpGroup">
        <label for="totp">2FA code (6 digits)</label>
        <input id="totp" name="totp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" />
        <div class="helper">From your authenticator app.</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/forms.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!Forms.validate(e.target)) return;

      const body = Object.fromEntries(new FormData(e.target));
      body.expectRole = 'admin';

      try {
        const resp = await API.post('/auth/login', body);
        toast('Signed in.', 'success');
        setTimeout(() => { window.location.href = '/pages/admin-dashboard'; }, 400);
      } catch (err) {
        // If 2FA is required, surface the field
        if (err.message && err.message.toLowerCase().includes('2fa')) {
          document.getElementById('totpGroup').classList.remove('hidden');
          document.getElementById('totp').focus();
          toast('Enter your 2FA code.', 'info');
          return;
        }
        toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
