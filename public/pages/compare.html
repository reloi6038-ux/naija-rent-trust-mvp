<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare Properties — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="section-head">
      <div class="eyebrow">Side by side</div>
      <h1>Compare properties</h1>
      <p class="section-sub">See fees, features, and review status side by side.</p>
    </div>
    <div id="compareRoot"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/compare.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (function render() {
      const list = Compare.list();
      const root = document.getElementById('compareRoot');

      if (!list.length) {
        root.innerHTML = `
          <div class="empty">
            <img src="/images/empty-search.svg" alt="" width="220" />
            <h3>No properties to compare</h3>
            <p>Browse listings and click "Compare" to add properties.</p>
            <a class="btn btn-primary" href="/pages/properties">Browse rentals</a>
          </div>`;
        return;
      }

      const rows = [
        { label: 'Photo', render: p => `<img src="${p.photos[0] || '/images/placeholder.svg'}" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;" />` },
        { label: 'Title', render: p => `<strong>${escapeHtml(p.title)}</strong><br><span class="text-muted" style="font-size:.85rem;">${escapeHtml(p.area)}, ${escapeHtml(p.state)}</span>` },
        { label: 'Property type', render: p => escapeHtml(p.propertyType) },
        { label: 'Bedrooms', render: p => p.bedrooms },
        { label: 'Bathrooms', render: p => p.bathrooms },
        { label: 'Annual rent', render: p => `<strong style="color:var(--brand-500);">${naira(p.annualRent)}</strong>` },
        { label: 'Agency fee', render: p => naira(p.agencyFee) },
        { label: 'Legal fee', render: p => naira(p.legalFee) },
        { label: 'Caution deposit', render: p => naira(p.cautionDeposit) },
        { label: 'Total move-in', render: p => `<strong style="color:var(--accent-600);">${naira(p.totalMoveInCost)}</strong>` },
        { label: 'Review status', render: p => p.reviewedAt ? `<span class="pill badge-published">Reviewed ${new Date(p.reviewedAt).toLocaleDateString()}</span>` : '<span class="pill">Not reviewed</span>' },
        { label: 'Condition score', render: p => p.conditionScore ? `${p.conditionScore.toFixed(1)} / 5` : '—' },
        { label: 'Amenities', render: p => (p.amenities || []).slice(0, 6).map(a => `<span class="pill" style="font-size:.72rem;">${escapeHtml(a)}</span>`).join(' ') || '—' }
      ];

      root.innerHTML = `
        <div style="overflow-x:auto;">
          <table class="table" style="min-width:${Math.max(600, list.length * 240)}px;">
            <thead>
              <tr>
                <th style="width:160px;">Attribute</th>
                ${list.map(p => `
                  <th>
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                      <span style="font-weight:700;color:var(--text);text-transform:none;letter-spacing:0;">${escapeHtml(p.title.slice(0,28))}${p.title.length > 28 ? '…' : ''}</span>
                      <button data-remove="${p._id}" style="background:none;border:none;color:var(--danger-500);cursor:pointer;" aria-label="Remove">✕</button>
                    </div>
                  </th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td style="font-weight:600;color:var(--text-muted);">${row.label}</td>
                  ${list.map(p => `<td>${row.render(p)}</td>`).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;

      root.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
        Compare.remove(b.dataset.remove);
        render();
      });
    })();
  </script>
</body>
</html>
