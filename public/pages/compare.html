<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare Properties — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/properties">Browse rentals</a>
        <a href="/pages/compare" class="active">Compare</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="page-header" style="background: transparent; padding: 0; margin-bottom: 24px;">
      <div class="eyebrow">Side by side</div>
      <h1 style="margin:0;">Compare properties</h1>
      <p class="section-sub">See fees, features, and review status side by side.</p>
    </div>
    <div id="compareRoot"></div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent</div></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/compare.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function render() {
      const list = Compare.list();
      const root = document.getElementById('compareRoot');

      if (!list.length) {
        root.innerHTML = `
          <div class="empty">
            <img src="/images/empty-search.svg" alt="" width="220" style="margin:0 auto 16px;" />
            <h3>No properties to compare</h3>
            <p>Browse listings and click "Compare" to add properties.</p>
            <a class="btn btn-primary mt-2" href="/pages/properties">Browse rentals</a>
          </div>`;
        return;
      }

      const rows = [
        { label: 'Photo', render: p => `<img src="${p.photos[0] || '/images/placeholder.svg'}" alt="" style="width:100%;min-width:80px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;" />` },
        { label: 'Title', render: p => `<strong>${escapeHtml(p.title)}</strong><br><span class="text-muted" style="font-size:.85rem;">${escapeHtml(p.area)}, ${escapeHtml(p.state)}</span>` },
        { label: 'Type', render: p => escapeHtml(p.propertyType) },
        { label: 'Beds', render: p => p.bedrooms },
        { label: 'Baths', render: p => p.bathrooms },
        { label: 'Annual Rent', render: p => `<strong style="color:var(--brand-500);">${naira(p.annualRent)}</strong>` },
        { label: 'Agency Fee', render: p => naira(p.agencyFee) },
        { label: 'Legal Fee', render: p => naira(p.legalFee) },
        { label: 'Caution', render: p => naira(p.cautionDeposit) },
        { label: 'Total Move-in', render: p => `<strong style="color:var(--accent-600);">${naira(p.totalMoveInCost)}</strong>` },
        { label: 'Review', render: p => p.reviewedAt ? `<span class="pill badge-published">Reviewed</span>` : '<span class="pill">Not reviewed</span>' },
        { label: 'Condition', render: p => p.conditionScore ? `${p.conditionScore.toFixed(1)}/5` : '—' }
      ];

      root.innerHTML = `
        <div class="table-wrap">
          <table class="table" style="min-width:${Math.max(400, list.length * 180)}px;">
            <thead>
              <tr>
                <th style="width:120px;">Attribute</th>
                ${list.map(p => `
                  <th>
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                      <span style="font-weight:700;color:var(--text);text-transform:none;letter-spacing:0;">${escapeHtml(p.title.slice(0,20))}...</span>
                      <button data-remove="${p._id}" style="background:none;border:none;color:var(--danger-500);cursor:pointer;" aria-label="Remove">✕</button>
                    </div>
                  </th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${rows.map(row => `
                <tr>
                  <td style="font-weight:600;color:var(--text-muted);">${row.label}</td>
                  ${list.map(p => `<td>${row.render(p)}</td>`).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;

      root.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
        Compare.remove(b.dataset.remove);
        render();
      });
    })();
  </script>
</body>
</html>
