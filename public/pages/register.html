<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register as a Lister — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />`n  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <img src="/images/logo-mark.svg" alt="" width="32" height="32" />
        Naija<em>Rent</em>
      </a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/properties">Browse rentals</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section" style="max-width:560px;">
    <div class="section-head">
      <div class="eyebrow">Get started</div>
      <h1>Create your lister account</h1>
      <p class="section-sub">Publish and manage properties across Nigeria.</p>
    </div>

    <form id="regForm" class="card" style="padding:28px;" novalidate>
      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" name="name" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" required autocomplete="tel" placeholder="+234 801 234 5678" />
      </div>
      <div class="form-group">
        <label for="password">Password (min 8 chars)</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
        <div class="helper">At least 8 characters.</div>
      </div>

      <!-- NEW: Terms acceptance -->
      <div class="form-group" style="display:flex;align-items:flex-start;gap:10px;">
        <input
          id="acceptTerms"
          name="acceptTerms"
          type="checkbox"
          required
          style="margin-top:3px;width:18px;height:18px;flex-shrink:0;"
        />
        <label for="acceptTerms" style="font-weight:500;color:var(--text-soft);font-size:.92rem;line-height:1.5;">
          I agree to the
          <a href="/pages/terms" target="_blank" rel="noopener">Terms of Service</a>
          and
          <a href="/pages/privacy" target="_blank" rel="noopener">Privacy Policy</a>.
          I understand that "Reviewed" listings are human-checked but not a guarantee of ownership or condition.
        </label>
      </div>

      <button class="btn btn-primary btn-block" type="submit">Create account</button>
      <p class="helper mt-2">
        Already registered? <a href="/pages/login">Sign in</a>
      </p>
    </form>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        © <span id="year"></span> NaijaRent ·
        <a href="/pages/terms">Terms</a> ·
        <a href="/pages/privacy">Privacy</a> ·
        <a href="/pages/cookies">Cookies</a> ·
        <a href="/pages/trust">Trust & Safety</a>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/forms.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;

      // Extra client-side guard for terms acceptance
      if (!form.acceptTerms.checked) {
        toast('You must accept the Terms and Privacy Policy.', 'error');
        form.acceptTerms.focus();
        return;
      }

      if (!Forms.validate(form)) return;

      const body = Object.fromEntries(new FormData(form));
      body.acceptTerms = form.acceptTerms.checked;

      try {
        await API.post('/auth/register', body);
        toast('Account created. You are now signed in.', 'success');
        setTimeout(() => { window.location.href = '/pages/lister-dashboard'; }, 900);
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
