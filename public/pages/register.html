<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register as a Lister — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body data-i18n-title-key="meta.register_title">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/properties" data-i18n="nav.browse">Browse rentals</a>
        <a href="/pages/about" data-i18n="nav.about">About</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <div class="lang-switcher" id="langSwitcher"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section" style="max-width:560px;">
    <div class="section-head text-center" style="text-align:center; margin-bottom:24px;">
      <div class="eyebrow">Get started</div>
      <h1 data-i18n="auth.register_title">Create your lister account</h1>
      <p class="section-sub" data-i18n="auth.register_sub">Publish and manage properties across Nigeria.</p>
    </div>

    <form id="regForm" class="card" style="padding:28px;" novalidate>
      <div class="form-group">
        <label for="name" data-i18n="auth.name">Full name</label>
        <input id="name" name="name" required autocomplete="name" placeholder="e.g. Adebayo Ogunlesi" />
      </div>
      <div class="form-group">
        <label for="email" data-i18n="auth.email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="phone" data-i18n="auth.phone">Phone</label>
        <input id="phone" name="phone" required autocomplete="tel" placeholder="+234 801 234 5678" />
      </div>
      <div class="form-group">
        <label for="password" data-i18n="auth.password">Password (min 8 chars)</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
        <div class="helper" data-i18n="auth.password_hint">At least 8 characters.</div>
      </div>

      <!-- Terms Checkbox -->
      <div class="form-group" style="display:flex;align-items:flex-start;gap:10px; margin-top:24px;">
        <input
          id="acceptTerms"
          name="acceptTerms"
          type="checkbox"
          required
          style="margin-top:4px;width:18px;height:18px;flex-shrink:0;cursor:pointer;"
        />
        <label for="acceptTerms" style="font-weight:500;color:var(--ink-700);font-size:.9rem;line-height:1.5;cursor:pointer;">
          <span data-i18n="auth.accept_terms">I agree to the Terms of Service and Privacy Policy.</span>
          I understand that "Reviewed" listings are human-checked but not a guarantee of ownership.
        </label>
      </div>

      <button class="btn btn-primary btn-block mt-2" type="submit" data-i18n="auth.register_button">Create account</button>
      <p class="helper mt-2 text-center" style="text-align:center;">
        <span data-i18n="auth.has_account">Already registered?</span> <a href="/pages/login" data-i18n="auth.sign_in">Sign in</a>
      </p>
    </form>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        © <span id="year"></span> NaijaRent ·
        <a href="/pages/terms" data-i18n="footer.terms">Terms</a> ·
        <a href="/pages/privacy" data-i18n="footer.privacy">Privacy</a> ·
        <a href="/pages/cookies" data-i18n="footer.cookies">Cookies</a>
      </div>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/forms.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (async () => { try { await I18n.init(); } catch {} })();

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;

      if (!form.acceptTerms.checked) {
        toast('You must accept the Terms and Privacy Policy.', 'error');
        form.acceptTerms.focus();
        return;
      }
      if (!Forms.validate(form)) return;

      const body = Object.fromEntries(new FormData(form));
      body.acceptTerms = form.acceptTerms.checked;

      try {
        await API.post('/auth/register', body);
        toast('Account created. You are now signed in.', 'success');
        setTimeout(() => { window.location.href = '/pages/lister-dashboard'; }, 900);
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
