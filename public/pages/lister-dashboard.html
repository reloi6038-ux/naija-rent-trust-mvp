<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="nav" role="banner">
    <div class="container nav-inner">
      <a class="brand" href="/"><img src="/images/logo-mark.svg" alt="" width="32" height="32" /> Naija<em>Rent</em></a>
      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="/pages/lister-dashboard" class="active">Dashboard</a>
        <a href="/pages/enquiries">Enquiries</a>
        <a href="/pages/properties">Browse</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <main id="main" class="container section">
    <div class="page-header" style="background: transparent; padding: 0; margin-bottom: 24px;">
      <div class="flex-between">
        <div>
          <div class="eyebrow">Your workspace</div>
          <h1 style="margin:0;">Dashboard</h1>
        </div>
        <div class="flex gap-2">
          <a href="/pages/lister-profile?id=me" class="btn btn-ghost" id="myProfileLink">View my profile</a>
          <a href="/pages/create-listing" class="btn btn-primary">+ New listing</a>
        </div>
      </div>
    </div>

    <div class="stats-grid mb-4" id="stats"></div>

    <h2 style="font-size:1.3rem; margin-bottom:16px; color:var(--ink-900);">My listings</h2>
    <div id="listings" class="grid grid-auto"></div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer-bottom">© <span id="year"></span> NaijaRent</div></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/animations.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const STATUS = {
      Published: { label: 'Published', cls: 'badge-published' },
      Pending: { label: 'Pending review', cls: 'badge-new' },
      Rejected: { label: 'Rejected', cls: 'badge-unpublished' },
      Rented: { label: 'Rented', cls: 'badge-rented' },
      Unpublished: { label: 'Unpublished', cls: 'badge-unpublished' }
    };

    (async () => {
      try {
        const me = await API.get('/auth/me');
        const link = document.getElementById('myProfileLink');
        if (link && me.user) link.href = `/pages/lister-profile?id=${me.user.id}`;

        const { data } = await API.get('/properties/mine');
        
        const counts = {
          total: data.length,
          published: data.filter(p => p.status === 'Published').length,
          pending: data.filter(p => p.status === 'Pending').length,
          rejected: data.filter(p => p.status === 'Rejected').length
        };

        const variants = { total: '', published: 'accent', pending: '', rejected: 'danger' };
        const labels = { total: 'Total listings', published: 'Published', pending: 'Pending', rejected: 'Rejected' };

        const statsEl = document.getElementById('stats');
        Object.entries(counts).forEach(([k, v]) => {
          statsEl.appendChild(Components.statCard({ value: v, label: labels[k], variant: variants[k] }));
        });

        const el = document.getElementById('listings');
        if (!data.length) {
          el.innerHTML = `<div class="empty" style="grid-column:1/-1;"><h3>No listings yet</h3><a class="btn btn-primary" href="/pages/create-listing">Create listing</a></div>`;
          return;
        }

        data.forEach((p) => {
          const card = Components.propertyCard(p, { href: `/pages/edit-listing?id=${p._id}` });
          const body = card.querySelector('.card-body');
          
          if (p.reviewedAt) {
            const reviewed = document.createElement('div');
            reviewed.className = 'helper'; reviewed.style.color = 'var(--accent-600)'; reviewed.style.marginTop = '6px';
            reviewed.innerHTML = `✅ Reviewed on ${new Date(p.reviewedAt).toLocaleDateString('en-NG')}`;
            body.appendChild(reviewed);
          }

          if (p.status === 'Published') {
            const pubLink = document.createElement('a');
            pubLink.href = `/pages/property-details?id=${p._id}`; pubLink.target = '_blank'; pubLink.className = 'helper';
            pubLink.style.display = 'inline-block'; pubLink.style.marginTop = '6px'; pubLink.textContent = '↗ View public page';
            body.appendChild(pubLink);
          }

          const actions = document.createElement('div');
          actions.className = 'flex gap-1 mt-2';
          actions.innerHTML = `
            <a class="btn btn-ghost btn-sm" href="/pages/edit-listing?id=${p._id}">Edit</a>
            ${p.status === 'Published' ? `<button class="btn btn-primary btn-sm" data-rented="${p._id}">Mark rented</button>` : ''}
          `;
          body.appendChild(actions);
          el.appendChild(card);
        });

        el.querySelectorAll('[data-rented]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('Mark this listing as rented?')) return;
            try {
              await API.post('/properties/' + btn.dataset.rented + '/rented', {});
              toast('Marked as rented', 'success'); setTimeout(() => location.reload(), 600);
            } catch (err) { toast(err.message, 'error'); }
          });
        });
      } catch (e) {
        toast('Please log in', 'error'); window.location.href = '/pages/login';
      }
    })();
  </script>
</body>
</html>
