<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — NaijaRent</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />`n  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <main class="container section" style="max-width:460px;">
    <h1>Forgot password</h1>
    <p class="section-sub">Enter your email and we'll send a reset link.</p>
    <form id="form" class="card" style="padding:28px;">
      <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required /></div>
      <button class="btn btn-primary btn-block">Send reset link</button>
      <p class="helper mt-2"><a href="/pages/login">Back to sign in</a></p>
    </form>
  </main>
  <script src="/js/api.js"></script><script src="/js/components.js"></script><script src="/js/ui.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      try { await API.post('/auth/forgot-password', body); toast('If that email exists, a reset link has been sent.', 'success'); }
      catch (err) { toast(err.message, 'error'); }
    });
  </script>
</body>
</html>
